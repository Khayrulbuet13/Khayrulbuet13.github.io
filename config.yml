params:
    description: "I'm a Postdoctoral Researcher at Lawrence Livermore National Laboratory (LLNL), working with the Nuclear Fusion Signal Processing and Control group on computer vision for real-time diagnostic systems. I enjoy the full CV and ML pipeline, from designing deep learning models to deploying them for high-performance, microsecond-level inference. I earned my Ph.D. in Mechanical Engineering from Lehigh University, where my research focused on machine-learning-based microfluidic computer vision and design optimization. Outside of work, I enjoy hiking, exploring new trails, and watching movies in my free time."
    author: Khayrul Islam
